<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI 风向 · 每天 10 分钟读懂 AI 圈</title>
<meta name="description" content="前沿人物说了什么、行业发生了什么——每天三刊，中文为主。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="AI 风向" href="feed.xml">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('pr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="page">
<header class="masthead">
  <div class="mast-text">
    <p class="kicker"><span class="dot"></span><span id="issue-line">正在调频…</span></p>
    <h1 class="wordmark">AI 风向<small>DAILY AI BOT</small></h1>
    <p class="dek">每天 10 分钟，看懂 AI 圈的人在想什么、行业在往哪走。</p>
  </div>
  <figure class="radar-wrap" aria-label="今日雷达：越靠近圆心越值得读，点光点跳到对应内容">
    <svg id="radar" viewBox="-160 -160 320 320" role="img">
      <defs>
        <radialGradient id="sweep-g" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="150">
          <stop offset="0" stop-color="var(--accent)" stop-opacity="0"/>
          <stop offset="1" stop-color="var(--accent)" stop-opacity=".3"/>
        </radialGradient>
      </defs>
      <g class="rings"><circle r="150"/><circle r="100"/><circle r="50"/>
        <line x1="-150" y1="0" x2="150" y2="0"/><line x1="0" y1="-150" x2="0" y2="150"/></g>
      <g class="sweep"><path d="M0 0 L150 0 A150 150 0 0 1 106 106 Z" fill="url(#sweep-g)"/><line x1="0" y1="0" x2="150" y2="0"/></g>
      <g id="blips"></g>
      <circle r="4" class="core"/>
    </svg>
    <div class="radar-tip" id="radar-tip" hidden></div>
  </figure>
</header>

<nav class="toolbar" aria-label="日期">
  <div class="days" id="days" role="tablist"></div>
  <button class="btn" id="theme" title="切换明暗" aria-label="切换明暗">◐</button>
</nav>
<p class="since" id="since"></p>

<main id="feed" tabindex="-1" aria-live="polite"></main>

<footer class="colophon" id="colophon"></footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
