# 数据源配置 —— 定位：前沿人物说了什么 + 中文 AI 资讯 + 「架构·评测」技术专栏，论文每天只留最热 1–2 篇。
# 时效：只收北京时间今天或昨天（T / T-1）发布的内容；没有发布时间的条目不收。
# authority: 0~1 来源权威度；lang: zh/en；kind: opinion(个人观点) / news(媒体) / official(官方发布)
# filter: ai → 综合科技媒体只保留 AI 相关内容；who: 人物身份（卡片上展示）
selection:
  per_run: 14            # 每个时段最多精选多少条资讯/观点（不含技术专栏和论文）
  tech_per_run: 4        # 每个时段「架构·评测」专栏条数（模型架构、harness、评测方法、新基准）
  tech_min_score: 0.3
  tech_llm_candidates: 20
  max_age_days: 1        # 1 = 只要今天和昨天（T-1）的内容
  zh_ratio: 0.7          # 目标中文占比
  papers_per_day: 2      # 每天论文上限（取热度最高的）
  min_score: 0.35
  max_per_source: 4      # 单一来源每期上限，保证多样性
  min_opinions: 3        # 每期至少保留几条「人物观点」（有合格候选时）
  llm_candidates: 80
  retain_pdf_days: 21

hf_daily:
  enabled: true
  authority: 0.7
  min_upvotes: 30        # 只看热度够高的论文
  tech_min_upvotes: 8    # 架构/评测类论文门槛放低，由 LLM 把关质量

hackernews:
  enabled: true
  authority: 0.55
  min_points: 150
  lookback_hours: 30
  keywords: [" ai ", "a.i.", "llm", "gpt", "claude", "gemini", "llama", "qwen", "deepseek", "mistral", "openai",
             "anthropic", "deepmind", "agent", "agi", "altman", "musk", "grok", "nvidia", "chatbot", "language model"]
  domains: ["arxiv.org", "openai.com", "anthropic.com", "deepmind.google", "ai.meta.com", "blog.samaltman.com", "x.ai"]

