html_lists:
  - {name: Anthropic, url: "https://www.anthropic.com/news", base: "https://www.anthropic.com",
     pattern: '^/(research|news)/[a-z0-9-]{6,}$', authority: 0.9}
  - {name: Anthropic Engineering, url: "https://www.anthropic.com/engineering", base: "https://www.anthropic.com",
     pattern: '^/engineering/[a-z0-9-]{6,}$', authority: 0.9, category: 技术}

# arXiv 新论文检索（架构 · 评测主题；无热度信号，由 LLM 判断质量）
arxiv_search:
  enabled: true
  authority: 0.55
  lookback_hours: 48
  max_results: 60
  categories: [cs.CL, cs.LG, cs.AI]
  terms: [JEPA, "world model", "mixture of experts", "state space", "linear attention", "sparse attention",
          "diffusion language model", "test-time", "scaling law", benchmark, evaluation, harness, scaffold,
          "agent framework", "context engineering", "latent reasoning", tokenizer, "long context"]

rss_lookback_hours: 48

# X（Twitter）：暂未启用。配置 X_BEARER_TOKEN 后自动启用
x:
  authority: 0.9
  min_likes: 300
  accounts: [sama, elonmusk, karpathy, AndrewYNg, ylecun, DrJimFan, gdb, emollick, dotey, op7418, vista8]
