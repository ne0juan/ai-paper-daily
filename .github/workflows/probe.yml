name: Probe sources
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"   # weekly health check
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/probe.py probe
      - run: scripts/push_report.sh probe probe
